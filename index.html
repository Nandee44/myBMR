<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myBMR</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Climate+Crisis:YEAR@1979&family=Dela+Gothic+One&family=Gasoek+One&family=Outfit:wght@100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
</head>
<body>
    <div id="top">
        <h4 id="name">myBMR</h4>
        <ion-icon name="contrast-outline"></ion-icon>
    </div>
    <div id="bottom">
        <h1>Calculate your BMR!</h1>
        <p>BMR stands for basal metabolic rate, and L is for the way you Look at me</p>
        <br>
        
        <form id="form">
            <div id="ageDiv" class="inp">
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" min="15" max="80">
            </div>

            <div id="genderDiv" class="inp">
                <label for="gender">Gender:</label>
                <label>
                    <input type="radio" name="gender" value="male">male
                </label>
                <label>
                    <input type="radio" name="gender" value="female">female
                </label>
            </div>

            <div id="heightDiv" class="inp">
                <label for="height">Height:</label>
                <input type="number" name="height" id="height">
            </div>

            <div id="weightDiv" class="inp">
                <label for="weight">Weight:</label>
                <input type="number" name="weight" id="weight">
            </div>

            <button type="submit" id="submit">Calculate BMR</button>
        </form>
        <br>
        <p id="result"></p>
    </div>
    <script src="script.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
