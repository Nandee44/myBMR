<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myBMR</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>   
<body>
    <div id="top">
        <h4 id="name">myBMR</h4>
        <ion-icon name="contrast-outline"></ion-icon>
    </div>
    <div id="bottom">
        <h1>Calculate your BMR!</h1>
        <p>BMR stands for basal metabolic rate, and L is for the way you Look at me</p>
        <span id="error"></span> <br>
        <form id="form">
            <div id="ageDiv" class="inp">
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" class="box">
            </div>

            <div id="genderDiv" class="inp">
                <label for="gender">Gender:</label>
                <label>
                    <input type="radio" class="radio" name="gender" value="male">male
                </label>
                <label>
                    <input type="radio" class="radio" name="gender" value="female" checked>female
                </label>
            </div>

            <div id="heightDiv" class="inp">
                <label for="height">Height:</label>
                <input type="number" name="height" id="height" class="box">
            </div>

            <div id="weightDiv" class="inp">
                <label for="weight">Weight:</label>
                <input type="number" name="weight" id="weight" class="box">
            </div>

            <button type="submit" id="submit">Calculate BMR</button>
        </form>
        <br>
        <p id="result"></p>
    </div>
    <footer>
        <p>Kawtar Ziadi 2026</p>
    </footer>
    <script src="script.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
